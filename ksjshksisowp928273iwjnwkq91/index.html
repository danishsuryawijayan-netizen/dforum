<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFORUM — Content Manager</title>
    <style>
      /* Paksa html dan body full screen */
      html, body {
        height: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow-y: auto !important; /* Biar bisa discroll */
        background-color: #f0f0f0 !important;
      }

      /* Targetkan ID root bawaan Decap/React */
      #root {
        height: 100vh !important;
        min-height: 100vh !important;
        display: flex !important;
        flex-direction: column !important;
      }

      /* Paksa semua div di dalam root biar nge-full */
      #root > div {
        flex-grow: 1 !important;
        min-height: 100% !important;
      }

      /* Khusus Mobile */
      @media screen and (max-width: 768px) {
        /* Sembunyikan scrollbar bawaan browser agar bersih */
        ::-webkit-scrollbar {
          display: none;
        }

        /* Paksa container form biar lebih lebar dan penuh */
        [data-testid="cms-editor"], .css-1v0mbdj, .cms-content {
          min-height: 100vh !important;
          height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Aktifkan mode inisialisasi manual sebelum memuat Decap CMS.
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Load Decap CMS script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Jalankan CMS dengan konfigurasi langsung di dalam halaman.
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: "github",
            repo: "danishsuryawijayan-netizen/dforum",
            branch: "master",
            base_url: "https://dforum-nine.vercel.app",
            auth_endpoint: "api/auth"
          },
          media_folder: "assets/img",
          public_folder: "assets/img",
          collections: [
            {
              name: "artikel",
              label: "Laporan Malware",
              folder: "artikel",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["WORM & BOTNET", "CRYPTOMINER", "APT & BACKDOOR"] },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Laporan", name: "body", widget: "markdown" }
              ]
            },
            {
              name: "berita",
              label: "Berita Siber",
              folder: "berita",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["BERITA"] },
                { label: "Sumber", name: "source", widget: "string" },
                { label: "Link Sumber", name: "source_url", widget: "string" },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Berita", name: "body", widget: "markdown" }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
