<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DFORUM — Content Manager</title>
    <style>
      html, body { margin: 0; padding: 0; }
      #nc-root { min-height: 100dvh; }
      /* hilangkan lebar minimum kontainer utama Decap */
      [class*="AppMainContainer"] { min-width: 0 !important; max-width: 100% !important; }

      /* Mencegah scroll horizontal di seluruh halaman */
      html, body {
        overflow-x: hidden !important;
        width: 100vw !important;
        max-width: 100vw !important;
      }

      /* Paksa semua wadah input dan editor agar lebarnya menyesuaikan layar */
      [class*="ControlContainer"],
      [class*="Editor"],
      [class*="RichText"],
      [class*="Field"],
      [data-slate-editor="true"],
      [data-testid="cms-editor"] {
        min-width: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
        box-sizing: border-box !important;
        word-wrap: break-word !important;
        white-space: pre-wrap !important; /* Memaksa teks turun ke bawah */
      }

      /* Toolbar editor juga jangan sampai memanjang */
      [class*="Toolbar"] {
        display: flex !important;
        flex-wrap: wrap !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      /* Paksa Toolbar Editor berjejer ke samping (horizontal) */
      [class*="Toolbar"], [class*="ToolbarContainer"] {
        display: flex !important;
        flex-direction: row !important; /* Kunci utama: Paksa berjejer ke samping */
        flex-wrap: wrap !important;
        justify-content: flex-start !important;
        width: 100% !important;
        padding: 5px !important;
      }

      /* Paksa tombol-tombol di dalam toolbar agar tidak memenuhi lebar layar */
      [class*="Toolbar"] button, [class*="Toolbar"] > div, [class*="Toolbar"] span {
        display: inline-flex !important;
        width: auto !important;
        flex: 0 0 auto !important;
        margin: 2px !important;
      }

      /* Ratakan teks isi berita ke kiri dengan padding yang pas */
      [data-slate-editor="true"], [class*="RichText"], [class*="EditorContainer"] {
        padding-left: 10px !important;
        padding-right: 10px !important;
        text-align: left !important;
        width: 100% !important;
      }

      /* Khusus tampilan HP */
      @media screen and (max-width: 768px) {
        /* Targetkan container header/topbar editor agar tidak sticky */
        header,
        [class*="TopBar"],
        [class*="AppHeader"],
        [class*="EditorHeader"],
        [class*="ToolbarContainer"] {
          position: relative !important; /* Ubah dari sticky/fixed jadi relative */
          top: auto !important;
          z-index: 1 !important;
          background-color: #f4f4f4 !important; /* Samakan dengan background agar menyatu */
          border-bottom: 1px solid #ccc !important;
        }

        /* Pastikan container utama editor bisa di-scroll dengan normal */
        [class*="EditorContainer"] {
          padding-top: 0 !important;
          overflow-y: visible !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Aktifkan mode inisialisasi manual sebelum memuat Decap CMS.
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Load Decap CMS script -->
    <script src="https://unpkg.com/decap-cms@3.1.9/dist/decap-cms.js"></script>

    <script>
      // Jalankan CMS dengan konfigurasi langsung di dalam halaman.
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: "github",
            repo: "danishsuryawijayan-netizen/dforum",
            branch: "master",
            base_url: "https://dforum-nine.vercel.app",
            auth_endpoint: "api/auth"
          },
          media_folder: "assets/img",
          public_folder: "assets/img",
          collections: [
            {
              name: "artikel",
              label: "Laporan Malware",
              folder: "artikel",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              editor: { preview: false },
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["WORM & BOTNET", "CRYPTOMINER", "APT & BACKDOOR"] },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Laporan", name: "body", widget: "markdown" }
              ]
            },
            {
              name: "berita",
              label: "Berita Siber",
              folder: "berita",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              editor: { preview: false },
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["BERITA"] },
                { label: "Sumber", name: "source", widget: "string" },
                { label: "Link Sumber", name: "source_url", widget: "string" },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Berita", name: "body", widget: "markdown" }
              ]
            }
          ]
        }
      });

      // Fungsi untuk menonaktifkan sticky header di mobile
      function disableStickyHeader() {
        if (window.innerWidth <= 768) {
          // Cari semua elemen div atau header
          const elements = document.querySelectorAll('div, header, section');

          elements.forEach(el => {
            const style = window.getComputedStyle(el);
            // Cek apakah elemen ini posisinya sticky atau fixed
            if (style.position === 'sticky' || style.position === 'fixed') {
              // Cek apakah di dalamnya ada tombol Publish atau Delete
              if (el.textContent.includes('Publish') || el.textContent.includes('Delete entry')) {
                el.style.setProperty('position', 'relative', 'important');
                el.style.setProperty('top', 'auto', 'important');
                el.style.setProperty('z-index', '1', 'important');
              }
            }
          });
        }
      }

      // Jalankan setelah CMS selesai memuat (beri jeda 2 detik)
      setTimeout(disableStickyHeader, 2000);

      // Jalankan juga setiap kali layar di-resize
      window.addEventListener('resize', disableStickyHeader);
    </script>
  </body>
</html>
