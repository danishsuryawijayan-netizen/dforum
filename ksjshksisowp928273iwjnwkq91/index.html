<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3E9D2" />
    <title>DFORUM — Content Manager</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
      html, body { margin: 0; padding: 0; }
      #nc-root { min-height: 100dvh; }
      /* hilangkan lebar minimum kontainer utama Decap */
      [class*="AppMainContainer"] { min-width: 0 !important; max-width: 100% !important; }

      /* Mencegah scroll horizontal di seluruh halaman */
      html, body {
        overflow-x: hidden !important;
        width: 100vw !important;
        max-width: 100vw !important;
      }

      /* Paksa semua wadah input dan editor agar lebarnya menyesuaikan layar */
      [class*="ControlContainer"],
      [class*="Editor"],
      [class*="RichText"],
      [class*="Field"],
      [data-slate-editor="true"],
      [data-testid="cms-editor"] {
        min-width: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
        box-sizing: border-box !important;
        word-wrap: break-word !important;
        white-space: pre-wrap !important; /* Memaksa teks turun ke bawah */
      }

      /* Toolbar editor juga jangan sampai memanjang */
      [class*="Toolbar"] {
        display: flex !important;
        flex-wrap: wrap !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      /* Paksa Toolbar Editor berjejer ke samping (horizontal) */
      [class*="Toolbar"], [class*="ToolbarContainer"] {
        display: flex !important;
        flex-direction: row !important; /* Kunci utama: Paksa berjejer ke samping */
        flex-wrap: wrap !important;
        justify-content: flex-start !important;
        width: 100% !important;
        padding: 5px !important;
      }

      /* Paksa tombol-tombol di dalam toolbar agar tidak memenuhi lebar layar */
      [class*="Toolbar"] button, [class*="Toolbar"] > div, [class*="Toolbar"] span {
        display: inline-flex !important;
        width: auto !important;
        flex: 0 0 auto !important;
        margin: 2px !important;
      }

      /* Ratakan teks isi berita ke kiri dengan padding yang pas */
      [data-slate-editor="true"], [class*="RichText"], [class*="EditorContainer"] {
        padding-left: 10px !important;
        padding-right: 10px !important;
        text-align: left !important;
        width: 100% !important;
      }

      [data-bar-parent] { padding-top: var(--bar-h, 66px) !important; }
    </style>
  </head>
  <body>
    <script>
      // Aktifkan mode inisialisasi manual sebelum memuat Decap CMS.
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Load Decap CMS script -->
    <script src="https://unpkg.com/decap-cms@3.1.9/dist/decap-cms.js"></script>

    <script>
      (function () {
        function findToolbar(root) {
          var btn = [].slice.call(root.querySelectorAll('button'))
            .filter(function (b) { return /publish/i.test(b.textContent); })[0];
          for (var el = btn; el && el !== root; el = el.parentElement) {
            var cs = getComputedStyle(el), r = el.getBoundingClientRect();
            if (['fixed', 'sticky', 'absolute'].indexOf(cs.position) > -1 &&
                r.top <= 2 && r.width >= innerWidth * 0.9) return el;
          }
        }
        function sync() {
          var root = document.getElementById('nc-root');
          if (!root) return;
          var bar = findToolbar(root);
          if (!bar) return;
          bar.setAttribute('data-bar', '1');
          bar.parentElement.setAttribute('data-bar-parent', '1');
          document.documentElement.style
            .setProperty('--bar-h', bar.getBoundingClientRect().height + 'px');
        }
        new MutationObserver(function () { requestAnimationFrame(sync); })
          .observe(document.body, { childList: true, subtree: true });
        addEventListener('resize', sync);
      })();
    </script>

    <script>
      // Jalankan CMS dengan konfigurasi langsung di dalam halaman.
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: "github",
            repo: "danishsuryawijayan-netizen/dforum",
            branch: "master",
            base_url: "https://dforum-nine.vercel.app",
            auth_endpoint: "api/auth"
          },
          media_folder: "assets/img",
          public_folder: "assets/img",
          collections: [
            {
              name: "artikel",
              label: "Laporan Malware",
              folder: "artikel",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              editor: { preview: false },
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["WORM & BOTNET", "CRYPTOMINER", "APT & BACKDOOR"] },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Laporan", name: "body", widget: "markdown" }
              ]
            },
            {
              name: "berita",
              label: "Berita Siber",
              folder: "berita",
              create: true,
              extension: "md",
              slug: "{{slug}}",
              editor: { preview: false },
              fields: [
                { label: "Judul", name: "title", widget: "string" },
                { label: "Tanggal", name: "date", widget: "datetime" },
                { label: "Kategori (Tag)", name: "category", widget: "select", options: ["BERITA"] },
                { label: "Sumber", name: "source", widget: "string" },
                { label: "Link Sumber", name: "source_url", widget: "string" },
                { label: "Gambar Thumbnail", name: "gambar", widget: "image", required: false, media_folder: "/assets/img", public_folder: "/assets/img" },
                { label: "Isi Berita", name: "body", widget: "markdown" }
              ]
            }
          ]
        }
      });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js');
        });
      }
    </script>
  </body>
</html>
